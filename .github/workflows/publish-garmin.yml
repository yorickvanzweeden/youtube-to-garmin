name: Publish Garmin app

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version to release
        required: true
        default: 0.1.0

permissions:
  contents: read

jobs:
  garmin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Connect IQ SDK Manager
        run: |
          mkdir -p "$RUNNER_TEMP/ciq-manager"
          curl --fail --location \
            https://github.com/lindell/connect-iq-sdk-manager-cli/releases/download/v0.8.4/connect-iq-sdk-manager-cli_0.8.4_Linux_x86_64.tar.gz \
            --output "$RUNNER_TEMP/ciq-manager.tar.gz"
          tar -xzf "$RUNNER_TEMP/ciq-manager.tar.gz" -C "$RUNNER_TEMP/ciq-manager"
          echo "$RUNNER_TEMP/ciq-manager" >> "$GITHUB_PATH"

      - name: Validate Garmin configuration
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_IQ_ACCEPTANCE_HASH: ${{ secrets.GARMIN_IQ_ACCEPTANCE_HASH }}
        run: |
          test -n "$GARMIN_USERNAME"
          test -n "$GARMIN_PASSWORD"
          test -n "$GARMIN_IQ_ACCEPTANCE_HASH"
          connect-iq-sdk-manager agreement accept --agreement-hash="$GARMIN_IQ_ACCEPTANCE_HASH"
          connect-iq-sdk-manager login --username="$GARMIN_USERNAME" --password="$GARMIN_PASSWORD"
          connect-iq-sdk-manager sdk set '^9.2.0'
          connect-iq-sdk-manager device download --manifest=apps/garmin/manifest.xml

      - name: Export signed Garmin package
        env:
          GARMIN_DEVELOPER_KEY_B64: ${{ secrets.GARMIN_DEVELOPER_KEY_B64 }}
          GARMIN_TARGET_DEVICE: ${{ vars.GARMIN_TARGET_DEVICE }}
        run: |
          test -n "$GARMIN_DEVELOPER_KEY_B64"
          test -n "$GARMIN_TARGET_DEVICE"
          export GARMIN_SDK_BIN="$(connect-iq-sdk-manager sdk current-path --bin)"
          key_file="$RUNNER_TEMP/garmin-developer-key.der"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$GARMIN_DEVELOPER_KEY_B64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          export GARMIN_DEVELOPER_KEY="$key_file"
          chmod +x scripts/garmin-release.sh
          release_version="${{ inputs.version || github.ref_name }}"
          scripts/garmin-release.sh "${release_version#v}"

      - name: Upload device sideload artifact
        uses: actions/upload-artifact@v4
        with:
          name: garmin-prg-${{ inputs.version || github.ref_name }}
          path: output/garmin/*.prg
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          release_version="${{ inputs.version || github.ref_name }}"
          tag="v${release_version#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" output/garmin/*.iq --clobber
          else
            gh release create "$tag" output/garmin/*.iq \
              --title "$release_version" \
              --generate-notes
          fi
