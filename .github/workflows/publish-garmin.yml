name: Publish Garmin app

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version to release
        required: true
        default: 0.1.0

permissions:
  contents: read

jobs:
  garmin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: echo "release workflow started"
