name: Release Garmin app

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version to release
        required: true
        default: 0.1.0

permissions:
  contents: read

jobs:
  garmin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Garmin release runner started"
